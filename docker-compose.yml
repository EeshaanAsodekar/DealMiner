version: '3.8'

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # MongoDB Configuration
    MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING:-mongodb+srv://easodekar_db_user:cKbGKk8U3Q7LGoVT@manda.svuxf3p.mongodb.net/}
    MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME:-${MONGODB_DATABASE:-dealminer}}
    MONGODB_COLLECTION_NAME: ${MONGODB_COLLECTION_NAME:-rawfilings}
    # SEC Configuration
    SEC_REQUEST_DELAY: ${SEC_REQUEST_DELAY:-0.1}
    SEC_USER_AGENT: ${SEC_USER_AGENT:-DealMiner - M&A Data Extraction Tool contact@example.com}
    # Use writable data dir in Docker (dealminer is mounted ro; data is at /opt/airflow/data)
    DEALMINER_DATA_DIR: /opt/airflow/data
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags:rw
    - ${AIRFLOW_PROJ_DIR:-.}/dealminer:/opt/airflow/dealminer:ro
    - ${AIRFLOW_PROJ_DIR:-.}/scripts:/opt/airflow/scripts:ro
    - ${AIRFLOW_PROJ_DIR:-.}/dealminer/data:/opt/airflow/data:rw
    - airflow-logs:/opt/airflow/logs
    - airflow-plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Initializing Airflow database..."
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        if [[ -n "$${AIRFLOW_UID}" ]]; then
          chown -R "$${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins}
        fi
        # The entrypoint script will handle db init based on _AIRFLOW_DB_UPGRADE and _AIRFLOW_WWW_USER_CREATE env vars
        exec /entrypoint bash -c "echo 'Database initialization will be handled by entrypoint'"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources

volumes:
  postgres-db-volume:
  airflow-logs:
  airflow-plugins:
